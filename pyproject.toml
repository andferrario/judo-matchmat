[project]
name = "judo-matchmat"
version = "0.1.0"
description = "Find the matches in YouTube videos of judo tournaments by reading the on-screen scoreboard."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "andferrario" }]
requires-python = ">=3.10"
keywords = ["judo", "youtube", "ocr", "video-indexing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "imageio-ffmpeg>=0.5",
    "numpy>=1.26",
    # onnxruntime stopped publishing Intel Mac wheels after 1.23.
    "onnxruntime>=1.18; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "onnxruntime>=1.18,<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "opencv-python-headless>=4.9",
    "rapidocr>=3.0",
    "requests>=2.31",
    "yt-dlp>=2025.1.1",
]

[project.scripts]
matchmat = "judo_matchmat.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.uv]
# Keep everything inside the project folder: deleting it removes the cache too.
cache-dir = ".tools/cache"

[tool.pytest.ini_options]
testpaths = ["tests"]
